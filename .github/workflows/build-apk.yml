name: Compilar e instalar BalanceJava (APK firmado)

# Se dispara SOLO a mano, desde la app de GitHub o github.com → pestaña
# "Actions" → este workflow → botón "Run workflow". Así no se genera un
# build (ni un Release) por cada commit intermedio que todavía no quieres
# probar en el dispositivo.
on:
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama a compilar"
        required: true
        default: "pruebas"

permissions:
  contents: write   # necesario para poder publicar el Release con el APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rama }}

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Restaurar el keystore de firma desde el secreto
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Compilar el APK release firmado
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Borrar el keystore del runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Publicar el APK como Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "BalanceJava build ${{ github.run_number }} (${{ github.event.inputs.rama }})"
          body: |
            APK firmado, compilado a mano desde la rama `${{ github.event.inputs.rama }}`
            (commit ${{ github.sha }}).

            Para instalar/actualizar en el dispositivo: abre este Release desde el
            navegador o la app de GitHub, descarga el .apk y ábrelo. La primera vez
            hay que habilitar "instalar apps de origen desconocido" para esa app.
          files: app/build/outputs/apk/release/app-release.apk
