plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.jj.appbalancev31'
    compileSdk 35

    defaultConfig {
        applicationId "com.jj.appbalancev31"
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        /*packagingOptions {
            exclude 'META-INF/DEPENDENCIES'


        }*/

        packagingOptions {
            exclude 'META-INF/DEPENDENCIES'
            exclude 'META-INF/LICENSE'
            exclude 'META-INF/LICENSE.txt'
            exclude 'META-INF/license.txt'
            exclude 'META-INF/NOTICE'
            exclude 'META-INF/NOTICE.txt'
            exclude 'META-INF/notice.txt'
            exclude 'META-INF/ASL2.0'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    /*compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11g
    }*/

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    /*compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }*/
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //Del proyecto anterior:
    //implementation 'androidx.lifecycle: lifecycle- viewmodel- ktx: 2. 6. 2'
    implementation("androidx.lifecycle:lifecycle-viewmodel:2.8.7")
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    //implementation 'org.jetbrains:annotations-java5:15.0'
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0' // Agregar esta línea
    implementation ('org.jetbrains:annotations:23.0.0') {
        exclude group: 'org.jetbrains', module: 'annotations-java5'
    }

    implementation 'com.google.code.gson:gson:2.8.8'
    implementation "androidx.fragment:fragment:1.8.6"
    //implementation "androidx.fragment:fragment-ktx:1.8.6"
    def fragment_version = "1.8.6"

    // Java language implementation
    implementation "androidx.fragment:fragment:$fragment_version"

    implementation 'com.getbase:floatingactionbutton:1.10.1'
    implementation 'com.itextpdf:itextpdf:5.5.13.3'
    implementation 'com.google.api-client:google-api-client-android:1.23.0'
    implementation 'com.google.api-client:google-api-client:1.23.0'
    //implementation 'com.google.apis:google-api-services-drive:v3-rev20230722-2.0.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev197-1.25.0'
    //implementation 'com.google.android.gms:play-services-auth:11.6.0'
    implementation 'androidx.core:core:1.13.0'

    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    configurations.all {
        exclude group: "com.google.guava", module: "listenablefuture"
    }

}